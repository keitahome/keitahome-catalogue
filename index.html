<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f3d2f" />
  <meta name="description" content="KeitaHome Product Catalogue — Fall 2026. Softness without borders." />
  <title>KeitaHome · Product Catalogue — Fall 2026</title>
  <link rel="icon" href="keita-tree-logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2a22;
      --green: #1f3d2f;
      --green-deep: #163026;
      --mist: #e8efe9;
      --paper: #f7faf7;
      --muted: #5c6d63;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: "Outfit", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(120% 80% at 50% -10%, #dce8df 0%, transparent 55%),
        linear-gradient(180deg, var(--paper) 0%, var(--mist) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      width: min(100%, 22rem);
      text-align: center;
      animation: rise 0.7s ease-out both;
    }

    .mark {
      width: 4.5rem;
      height: auto;
      margin: 0 auto 1.25rem;
      display: block;
      animation: fade 1s ease-out both;
    }

    h1 {
      font-family: "Fraunces", serif;
      font-weight: 600;
      font-size: clamp(1.85rem, 7vw, 2.25rem);
      letter-spacing: 0.02em;
      color: var(--green);
      line-height: 1.15;
    }

    p {
      margin-top: 0.7rem;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.45;
      font-weight: 400;
    }

    .cta {
      margin-top: 1.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3.1rem;
      width: 100%;
      padding: 0.85rem 1.25rem;
      border-radius: 0.55rem;
      background: var(--green);
      color: #f4f8f5;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: 0.01em;
      transition: background 0.2s ease, transform 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .cta:hover,
    .cta:focus-visible {
      background: var(--green-deep);
      transform: translateY(-1px);
      outline: none;
    }

    .cta:active {
      transform: translateY(0);
    }

    .hint {
      margin-top: 0.9rem;
      font-size: 0.82rem;
      color: var(--muted);
      opacity: 0.9;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      main, .mark { animation: none; }
      .cta { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="keita-tree-logo.png" width="72" height="129" alt="KeitaHome tree mark" />
    <h1>KeitaHome</h1>
    <p>KeitaHome Product Catalogue — Fall 2026.</p>
    <a class="cta" href="product-catalogue.pdf" type="application/pdf">
      Open catalogue PDF
    </a>
    <p class="hint">Opens or downloads in your browser.</p>
  </main>
</body>
</html>
